name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Build Boring Notch (${{ matrix.xcode }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            xcode: "^27"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
        with:
          xcode: ${{ matrix.xcode }}
          platform: macOS
          scheme: boringNotch
          action: build
          verbosity: xcpretty
          upload-logs: always
          configuration: release

      - name: Package app
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -path '*/Build/Products/Release/*.app' -type d | head -1)
          test -n "$app" || { echo "::error::Release .app not found"; exit 1; }
          # The vendored MediaRemoteAdapter.framework carries upstream's Team ID;
          # with hardened runtime, library validation refuses it next to an
          # ad-hoc app. Re-sign the framework ad-hoc and reseal the app without
          # hardened runtime, keeping entitlements (a plain --deep re-sign drops them).
          codesign --force --sign - "$app/Contents/Frameworks/MediaRemoteAdapter.framework"
          codesign --force --sign - --preserve-metadata=entitlements "$app"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements - "$app" | grep -q personal-information.calendars
          ditto -c -k --keepParent "$app" zzz-notch.zip

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zzz-notch-${{ github.sha }}
          path: zzz-notch.zip
          retention-days: 14

      # Unit tests run hosted by the app (TEST_HOST), so they spawn a real
      # menubar-app instance on the runner — acceptable on CI where nothing
      # else reacts to it; they are skipped on matrix legs without hosted-test
      # support if they ever become flaky there.
      - name: Test
        uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
        with:
          xcode: ${{ matrix.xcode }}
          platform: macOS
          scheme: boringNotch
          action: test
          verbosity: xcpretty
          upload-logs: always
          configuration: debug
